# Use command the following commands to test:
# hyprctl hyprsunset temperature [value] (Default was 6000)
# hyprctl hyprsunset identity -> Disables filter and return to standard colors/brightness


# Define daytime: Normal colors and full brightness
profile {
#    identity = true   # Disables blue light filter
    time = 07:00
    temperature = 5250
    gamma = 0.9        # Standard brightness
}

# Define evening: Warm colors (Windows default is ~4500K-5000K)
profile {
    time = 19:00
    temperature = 5000
    gamma = 0.8       # Slightly dimmed
}

# Define late night: Extra warm and dimmed
profile {
    time = 22:30
    temperature = 4500
    gamma = 0.7       # Dimmed for dark rooms
}
