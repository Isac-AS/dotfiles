# Hand written config that survives config exports
[location]
# latitude  = 28.0
# longitude = -15.57
latitude  = 27.76
longitude = -15.59

[nightlight]
enabled = true
force = false

temperature_day = 4000
temperature_night = 3800

[widget.clock]
format = "{:%H:%M} | {:%Y-%m-%d}"

#sudo pacman -S ddcutil
#sudo usermod -aG i2c $USER
# log out and back in for the group to apply
[brightness]
enable_ddcutil = true