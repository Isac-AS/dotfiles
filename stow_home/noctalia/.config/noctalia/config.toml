[accessibility]
ui_scale = 1.2500000111758709

[bar.default]
end = [
    "tray",
    "clipboard",
    "notifications",
    "notes",
    "spacer_2",
    "group:g2",
    "group:g3",
    "group:g1",
    "control-center",
    "spacer_3",
    "session"
]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g1"
    members = [ "network", "network_rx" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g2"
    members = [ "media", "volume" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "tertiary_container"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g3"
    members = [ "cpu", "ram", "temp" ]
    opacity = 1.0
    padding = 6.0

